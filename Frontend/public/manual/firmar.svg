<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="600" height="340" rx="16" fill="#0f172a"/>
  
  <!-- Barra superior -->
  <rect width="600" height="42" rx="16" fill="#1e293b"/>
  <rect y="26" width="600" height="16" fill="#1e293b"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <text x="80" y="25" fill="#94a3b8" font-size="11" font-weight="600">HyS Control • Panel de Firma Digital Tactil</text>
  
  <!-- Contenedor -->
  <rect x="20" y="58" width="560" height="262" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <text x="38" y="86" fill="#f8fafc" font-size="14" font-weight="700">Conformidad de Inspeccion: Rubrica Manuscrita Digital</text>
  <text x="38" y="103" fill="#64748b" font-size="11">Dibuja la firma directamente en pantalla con el dedo o con el cursor</text>

  <!-- Canvas Inspector -->
  <rect x="38" y="118" width="246" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="48" y="136" fill="#64748b" font-size="10" font-weight="700">FIRMA DEL INSPECTOR/A</text>
  <!-- Firma simulada trazo curvo -->
  <path d="M 60 190 Q 90 150 120 185 T 170 170 T 210 195 T 240 180" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="215" x2="272" y2="215" stroke="#94a3b8" stroke-dasharray="4"/>
  <text x="50" y="235" fill="#475569" font-size="9">Lic. Matias Urquiza • Matr. HYS-4821</text>

  <!-- Canvas Titular Empresa -->
  <rect x="306" y="118" width="256" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="316" y="136" fill="#64748b" font-size="10" font-weight="700">FIRMA RESPONSABLE DE EMPRESA</text>
  <!-- Firma simulada 2 -->
  <path d="M 326 195 Q 360 145 390 180 T 450 165 T 510 185" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="318" y1="215" x2="550" y2="215" stroke="#94a3b8" stroke-dasharray="4"/>
  <text x="318" y="235" fill="#475569" font-size="9">Ing. Carlos Gomez • Gerente de Planta</text>

  <!-- Botones inferiores -->
  <rect x="38" y="266" width="100" height="34" rx="8" fill="#64748b" fill-opacity="0.2" stroke="#64748b" stroke-width="1"/>
  <text x="68" y="287" fill="#cbd5e1" font-size="11" font-weight="600">Limpiar</text>

  <rect x="422" y="266" width="140" height="34" rx="8" fill="#10b981"/>
  <text x="444" y="287" fill="#ffffff" font-size="11" font-weight="700">Guardar Firmas</text>
</svg>
