<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="600" height="340" rx="16" fill="#0f172a"/>
  
  <!-- Barra superior -->
  <rect width="600" height="42" rx="16" fill="#1e293b"/>
  <rect y="26" width="600" height="16" fill="#1e293b"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <text x="80" y="25" fill="#94a3b8" font-size="11" font-weight="600">HyS Control • Registro de Evidencias Fotograficas</text>
  
  <!-- Contenedor -->
  <rect x="20" y="58" width="560" height="262" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <text x="38" y="86" fill="#f8fafc" font-size="14" font-weight="700">Adjuntar Evidencia: Falta puesta a tierra en tablero T1</text>
  <text x="38" y="103" fill="#64748b" font-size="11">Resolucion SRT 900/15 • Se permite hasta 2 fotos por no conformidad</text>

  <!-- Tarjetas de fotos -->
  <!-- Foto 1 -->
  <rect x="38" y="118" width="160" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="48" y="128" width="140" height="78" rx="6" fill="#334155"/>
  <path d="M 68 186 L 95 155 L 125 186 Z" fill="#64748b"/>
  <path d="M 115 186 L 140 160 L 175 186 Z" fill="#94a3b8"/>
  <circle cx="155" cy="148" r="7" fill="#fbbf24"/>
  <text x="48" y="224" fill="#94a3b8" font-size="10" font-weight="600">Foto 1: Detalle borne</text>

  <!-- Foto 2 -->
  <rect x="210" y="118" width="160" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="220" y="128" width="140" height="78" rx="6" fill="#334155"/>
  <path d="M 240 186 L 270 152 L 305 186 Z" fill="#64748b"/>
  <path d="M 290 186 L 320 162 L 348 186 Z" fill="#94a3b8"/>
  <circle cx="330" cy="148" r="7" fill="#fbbf24"/>
  <text x="220" y="224" fill="#94a3b8" font-size="10" font-weight="600">Foto 2: Panoramica</text>

  <!-- Panel lateral de clasificacion de gravedad -->
  <rect x="382" y="118" width="180" height="182" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="396" y="142" fill="#cbd5e1" font-size="11" font-weight="700">Clasificacion de Peligro:</text>
  
  <rect x="396" y="152" width="152" height="24" rx="6" fill="#ef4444"/>
  <text x="432" y="168" fill="#ffffff" font-size="10" font-weight="700">CRITICA</text>

  <rect x="396" y="182" width="152" height="24" rx="6" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1"/>
  <text x="440" y="198" fill="#fdba74" font-size="10" font-weight="600">MAYOR</text>

  <rect x="396" y="212" width="152" height="24" rx="6" fill="#eab308" fill-opacity="0.2" stroke="#eab308" stroke-width="1"/>
  <text x="430" y="228" fill="#fef08a" font-size="10" font-weight="600">MODERADA</text>

  <rect x="396" y="250" width="152" height="36" rx="8" fill="#2563eb"/>
  <text x="424" y="273" fill="#ffffff" font-size="11" font-weight="700">Guardar Evidencia</text>

  <!-- Boton de captura celular -->
  <rect x="38" y="250" width="332" height="36" rx="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="96" y="273" fill="#93c5fd" font-size="11" font-weight="600">Tomar foto con camara del celular o galeria</text>
</svg>
