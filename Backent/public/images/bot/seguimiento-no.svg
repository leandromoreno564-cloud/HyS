<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Seguimiento de un ítem en No" font-family="Inter, Segoe UI, Arial, sans-serif">
<rect width="720" height="400" rx="18" fill="#ffffff"/><rect x="1" y="1" width="718" height="398" rx="17" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<rect x="24" y="24" width="430" height="352" rx="14" fill="#f1f5f9"/><text x="44" y="52" font-size="13" fill="#0f172a" font-weight="800" text-anchor="start">¿Los tableros tienen puesta a tierra?</text><rect x="44" y="64" width="50" height="26" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="69" y="82" font-size="11.5" fill="#64748b" font-weight="800" text-anchor="middle">SI</text><rect x="100" y="64" width="50" height="26" rx="8" fill="#ef4444" stroke="#ef4444" stroke-width="1"/><text x="125" y="82" font-size="11.5" fill="#fff" font-weight="800" text-anchor="middle">NO</text><rect x="156" y="64" width="50" height="26" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="181" y="82" font-size="11.5" fill="#64748b" font-weight="800" text-anchor="middle">N/A</text><circle cx="210" cy="77" r="13" fill="#ef4444"/><text x="210" y="82" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">1</text><rect x="44" y="104" width="390" height="262" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/><text x="58" y="126" font-size="10" fill="#be123c" font-weight="800" text-anchor="start">SEGUIMIENTO · ÍTEM EN "NO"</text><text x="58" y="146" font-size="10" fill="#64748b" font-weight="700" text-anchor="start">Recomendación del técnico</text><rect x="58" y="152" width="362" height="38" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="68" y="175" font-size="10.5" fill="#0f172a" font-weight="500" text-anchor="start">Instalar la puesta a tierra del tablero principal</text><text x="58" y="210" font-size="10" fill="#64748b" font-weight="700" text-anchor="start">Fecha de recomendación</text><rect x="58" y="216" width="172" height="28" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="68" y="235" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">10/10/2026</text><text x="246" y="210" font-size="10" fill="#64748b" font-weight="700" text-anchor="start">Fecha de regulación (máx. 1 año)</text><rect x="246" y="216" width="174" height="28" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="256" y="235" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">10/04/2027</text><rect x="58" y="258" width="14" height="14" rx="4" fill="#2563eb"/><path d="M61 265 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2"/><text x="80" y="270" font-size="11" fill="#0f172a" font-weight="600" text-anchor="start">Acordado de palabra con el dueño</text><circle cx="412" cy="134" r="13" fill="#f59e0b"/><text x="412" y="139" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">2</text><text x="58" y="300" font-size="10.5" fill="#64748b" font-weight="500" text-anchor="start">Se agrega al calendario como</text><rect x="58" y="308" width="230" height="26" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1"/><text x="173" y="326" font-size="10.5" fill="#2563eb" font-weight="800" text-anchor="middle">HyS en el Trabajo · 10/04/2027</text><rect x="472" y="40" width="224" height="58" rx="12" fill="#ef4444" opacity="0.1"/><circle cx="494" cy="69" r="13" fill="#ef4444"/><text x="494" y="74" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">1</text><text x="516" y="65" font-size="13" fill="#0f172a" font-weight="800" text-anchor="start">Elegí "No"</text><text x="516" y="83" font-size="11" fill="#64748b" font-weight="500" text-anchor="start">El ítem no se cumple</text><rect x="472" y="116" width="224" height="58" rx="12" fill="#f59e0b" opacity="0.1"/><circle cx="494" cy="145" r="13" fill="#f59e0b"/><text x="494" y="150" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">2</text><text x="516" y="141" font-size="13" fill="#0f172a" font-weight="800" text-anchor="start">Completá el seguimiento</text><text x="516" y="159" font-size="11" fill="#64748b" font-weight="500" text-anchor="start">Recomendación y fechas</text><rect x="472" y="192" width="224" height="58" rx="12" fill="#2563eb" opacity="0.1"/><circle cx="494" cy="221" r="13" fill="#2563eb"/><text x="494" y="226" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">3</text><text x="516" y="217" font-size="13" fill="#0f172a" font-weight="800" text-anchor="start">Va al calendario</text><text x="516" y="235" font-size="11" fill="#64748b" font-weight="500" text-anchor="start">Se crea sola la actividad</text><rect x="472" y="272" width="224" height="92" rx="12" fill="#ecfdf5"/><text x="584" y="296" font-size="12" fill="#047857" font-weight="800" text-anchor="middle">Regla de las fechas</text><text x="584" y="316" font-size="10.5" fill="#64748b" font-weight="500" text-anchor="middle">La regulación puede ser como</text><text x="584" y="332" font-size="10.5" fill="#64748b" font-weight="500" text-anchor="middle">máximo 1 año después de</text><text x="584" y="348" font-size="10.5" fill="#64748b" font-weight="500" text-anchor="middle">la fecha de recomendación</text>
</svg>
