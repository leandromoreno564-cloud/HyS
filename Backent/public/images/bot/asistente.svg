<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Asistente HyS" font-family="Inter, Segoe UI, Arial, sans-serif">
<rect width="720" height="400" rx="18" fill="#ffffff"/><rect x="1" y="1" width="718" height="398" rx="17" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<rect x="24" y="24" width="300" height="352" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="24" y="24" width="300" height="46" rx="16" fill="#2563eb"/><rect x="24" y="50" width="300" height="20" rx="0" fill="#2563eb"/><circle cx="52" cy="47" r="14" fill="#fff" opacity=".25"/><text x="76" y="45" font-size="13" fill="#fff" font-weight="800" text-anchor="start">Asistente HyS</text><text x="76" y="60" font-size="9" fill="#dbeafe" font-weight="500" text-anchor="start">Guía rápida · respuestas al instante</text><rect x="36" y="84" width="200" height="48" rx="12" fill="#f1f5f9"/><text x="48" y="104" font-size="11" fill="#0f172a" font-weight="500" text-anchor="start">¡Hola! Elegí un tema o</text><text x="48" y="120" font-size="11" fill="#0f172a" font-weight="500" text-anchor="start">escribime tu consulta.</text><rect x="36" y="146" width="130" height="24" rx="12" fill="#fff" stroke="#bfdbfe" stroke-width="1"/><text x="46" y="162" font-size="10.5" fill="#2563eb" font-weight="700" text-anchor="start">Primeros pasos</text><rect x="36" y="178" width="138" height="24" rx="12" fill="#fff" stroke="#bfdbfe" stroke-width="1"/><text x="46" y="194" font-size="10.5" fill="#2563eb" font-weight="700" text-anchor="start">Relevamiento</text><rect x="36" y="210" width="146" height="24" rx="12" fill="#fff" stroke="#bfdbfe" stroke-width="1"/><text x="46" y="226" font-size="10.5" fill="#2563eb" font-weight="700" text-anchor="start">Importar PDF o Word</text><rect x="150" y="246" width="164" height="28" rx="12" fill="#2563eb"/><text x="232" y="264" font-size="10.5" fill="#fff" font-weight="600" text-anchor="middle">¿Cómo subo fotos?</text><rect x="36" y="284" width="230" height="46" rx="12" fill="#f1f5f9"/><text x="48" y="303" font-size="10" fill="#0f172a" font-weight="500" text-anchor="start">Tocá "Agregar foto" en cada ítem.</text><text x="48" y="318" font-size="10" fill="#0f172a" font-weight="500" text-anchor="start">Hasta 2 por ítem.</text><rect x="36" y="340" width="226" height="28" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="46" y="358" font-size="10" fill="#94a3b8" font-weight="500" text-anchor="start">Escribí tu consulta…</text><rect x="270" y="340" width="40" height="28" rx="10" fill="#2563eb"/><rect x="350" y="50" width="190" height="58" rx="12" fill="#2563eb" opacity="0.1"/><circle cx="372" cy="79" r="13" fill="#2563eb"/><text x="372" y="84" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">1</text><text x="394" y="75" font-size="13" fill="#0f172a" font-weight="800" text-anchor="start">Elegí un tema</text><text x="394" y="93" font-size="11" fill="#64748b" font-weight="500" text-anchor="start">Botones rápidos</text><rect x="350" y="124" width="190" height="58" rx="12" fill="#f59e0b" opacity="0.1"/><circle cx="372" cy="153" r="13" fill="#f59e0b"/><text x="372" y="158" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">2</text><text x="394" y="149" font-size="13" fill="#0f172a" font-weight="800" text-anchor="start">O escribí tu duda</text><text x="394" y="167" font-size="11" fill="#64748b" font-weight="500" text-anchor="start">Con tus palabras</text><rect x="350" y="198" width="190" height="58" rx="12" fill="#10b981" opacity="0.1"/><circle cx="372" cy="227" r="13" fill="#10b981"/><text x="372" y="232" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">3</text><text x="394" y="223" font-size="13" fill="#0f172a" font-weight="800" text-anchor="start">Guías paso a paso</text><text x="394" y="241" font-size="11" fill="#64748b" font-weight="500" text-anchor="start">Con imágenes</text><rect x="350" y="272" width="330" height="88" rx="12" fill="#eff6ff"/><text x="515" y="298" font-size="13" fill="#2563eb" font-weight="800" text-anchor="middle">También te acerca el manual</text><text x="515" y="320" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">Descargalo en PDF o recorré cada capítulo</text><text x="515" y="338" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">desde el mismo asistente.</text>
</svg>
