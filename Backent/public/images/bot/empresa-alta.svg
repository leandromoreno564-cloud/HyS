art">Cantidad de trabajadores</text><rect x="366" y="308" width="318" height="28" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><circle cx="670" cy="196" r="13" fill="#f59e0b"/><text x="670" y="201" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">2</text><rect x="36" y="352" width="120" height="32" rx="10" fill="#2563eb"/><text x="96" y="373" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">Guardar</text><circle cx="176" cy="368" r="13" fill="#10b981"/><text x="176" y="373" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">3</text><text x="200" y="373" font-size="11.5" fill="#64748b" font-weight="500" text-anchor="start">Revisá los datos detectados antes de guardar</text>
