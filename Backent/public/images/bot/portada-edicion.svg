"800" text-anchor="middle">Salir de edición</text><rect x="266" y="334" width="150" height="24" rx="8" fill="#1e293b"/><text x="341" y="350" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">Textos y portada</text><text x="450" y="350" font-size="10.5" fill="#cbd5e1" font-weight="600" text-anchor="middle">Panel</text><circle cx="112" cy="346" r="13" fill="#f59e0b"/><text x="112" y="351" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">2</text><rect x="380" y="100" width="300" height="72" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1" stroke-dasharray="6 4"/><text x="530" y="132" font-size="12" fill="#f59e0b" font-weight="800" text-anchor="middle">Mover sección  ↑ ↓</text><text x="530" y="152" font-size="10.5" fill="#94a3b8" font-weight="500" text-anchor="middle">Reordená secciones enteras</text><circle cx="366" cy="136" r="13" fill="#f59e0b"/><text x="366" y="141" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">3</text><rect x="400" y="196" width="280" height="58" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1"/><circle cx="424" cy="225" r="13" fill="#f59e0b"/><text x="424" y="230" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">1</text><text x="446" y="221" font-size="13" fill="#fff" font-weight="800" text-anchor="start">Herramientas del ítem</text><text x="446" y="239" font-size="11" fill="#94a3b8" font-weight="500" text-anchor="start">Subir, ocultar, editar y borrar</text><rect x="530" y="270" width="150" height="46" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/><text x="605" y="290" font-size="11.5" fill="#fff" font-weight="800" text-anchor="middle">Modo edición</text><text x="605" y="306" font-size="9.5" fill="#94a3b8" font-weight="500" text-anchor="middle">Solo administradores</text>
