<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Cómo ingresar al sistema" font-family="Inter, Segoe UI, Arial, sans-serif">
<rect width="720" height="400" rx="18" fill="#ffffff"/><rect x="1" y="1" width="718" height="398" rx="17" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<rect x="24" y="24" width="400" height="64" rx="14" fill="#0f172a"/><rect x="40" y="40" width="32" height="32" rx="9" fill="#f59e0b"/><text x="84" y="62" font-size="13" fill="#fff" font-weight="800" text-anchor="start">HIGIENE Y SEGURIDAD</text><rect x="262" y="42" width="144" height="28" rx="9" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="334" y="61" font-size="11.5" fill="#f59e0b" font-weight="800" text-anchor="middle">INICIAR SESIÓN</text><circle cx="250" cy="56" r="13" fill="#f59e0b"/><text x="250" y="61" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">1</text><rect x="24" y="108" width="400" height="268" rx="14" fill="#f1f5f9"/><text x="44" y="140" font-size="16" fill="#0f172a" font-weight="800" text-anchor="start">Seguridad que empieza con vos.</text><text x="44" y="162" font-size="12" fill="#64748b" font-weight="500" text-anchor="start">La portada es lo primero que se ve.</text><rect x="44" y="184" width="150" height="80" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><rect x="210" y="184" width="150" height="80" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><rect x="44" y="278" width="316" height="70" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><rect x="450" y="24" width="246" height="352" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="473" y="64" font-size="17" fill="#0f172a" font-weight="800" text-anchor="start">Iniciar sesión</text><text x="473" y="84" font-size="11.5" fill="#64748b" font-weight="500" text-anchor="start">Ingresá tus credenciales</text><text x="473" y="112" font-size="10" fill="#64748b" font-weight="700" text-anchor="start">USUARIO</text><rect x="473" y="120" width="200" height="34" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="473" y="182" font-size="10" fill="#64748b" font-weight="700" text-anchor="start">CONTRASEÑA</text><rect x="473" y="190" width="200" height="34" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><circle cx="690" cy="137" r="13" fill="#2563eb"/><text x="690" y="142" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">2</text><rect x="473" y="246" width="200" height="38" rx="10" fill="#2563eb"/><text x="573" y="270" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">INGRESAR</text><circle cx="690" cy="265" r="13" fill="#10b981"/><text x="690" y="270" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">3</text><text x="573" y="312" font-size="11.5" fill="#2563eb" font-weight="700" text-anchor="middle">¿No tenés cuenta? Registrate</text><text x="573" y="330" font-size="10.5" fill="#64748b" font-weight="500" text-anchor="middle">(un administrador debe aprobarla)</text>
</svg>
