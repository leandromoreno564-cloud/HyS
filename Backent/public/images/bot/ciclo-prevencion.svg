<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Ciclo de prevención: identificar, evaluar, proteger, comunicar" font-family="Inter, Segoe UI, Arial, sans-serif">
<rect width="720" height="400" rx="18" fill="#ffffff"/><rect x="1" y="1" width="718" height="398" rx="17" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<text x="360" y="46" font-size="22" fill="#0f172a" font-weight="800" text-anchor="middle">Ciclo de prevención</text><text x="360" y="70" font-size="13" fill="#64748b" font-weight="500" text-anchor="middle">Se repite en cada tarea, todos los días</text><rect x="40" y="130" width="150" height="150" rx="18" fill="#2563eb" opacity=".10"/><rect x="40" y="130" width="150" height="150" rx="18" fill="none" stroke="#2563eb" stroke-width="2.5"/><circle cx="115" cy="175" r="26" fill="#2563eb"/><text x="115" y="184" font-size="26" fill="#fff" font-weight="800" text-anchor="middle">1</text><text x="115" y="230" font-size="18" fill="#0f172a" font-weight="800" text-anchor="middle">Identificar</text><text x="115" y="252" font-size="12.5" fill="#64748b" font-weight="500" text-anchor="middle">Reconocer los peligros</text><rect x="200" y="130" width="150" height="150" rx="18" fill="#f59e0b" opacity=".10"/><rect x="200" y="130" width="150" height="150" rx="18" fill="none" stroke="#f59e0b" stroke-width="2.5"/><circle cx="275" cy="175" r="26" fill="#f59e0b"/><text x="275" y="184" font-size="26" fill="#fff" font-weight="800" text-anchor="middle">2</text><text x="275" y="230" font-size="18" fill="#0f172a" font-weight="800" text-anchor="middle">Evaluar</text><text x="275" y="252" font-size="12.5" fill="#64748b" font-weight="500" text-anchor="middle">Medir el riesgo</text><rect x="360" y="130" width="150" height="150" rx="18" fill="#10b981" opacity=".10"/><rect x="360" y="130" width="150" height="150" rx="18" fill="none" stroke="#10b981" stroke-width="2.5"/><circle cx="435" cy="175" r="26" fill="#10b981"/><text x="435" y="184" font-size="26" fill="#fff" font-weight="800" text-anchor="middle">3</text><text x="435" y="230" font-size="18" fill="#0f172a" font-weight="800" text-anchor="middle">Proteger</text><text x="435" y="252" font-size="12.5" fill="#64748b" font-weight="500" text-anchor="middle">Aplicar las medidas</text><rect x="520" y="130" width="150" height="150" rx="18" fill="#8b5cf6" opacity=".10"/><rect x="520" y="130" width="150" height="150" rx="18" fill="none" stroke="#8b5cf6" stroke-width="2.5"/><circle cx="595" cy="175" r="26" fill="#8b5cf6"/><text x="595" y="184" font-size="26" fill="#fff" font-weight="800" text-anchor="middle">4</text><text x="595" y="230" font-size="18" fill="#0f172a" font-weight="800" text-anchor="middle">Comunicar</text><text x="595" y="252" font-size="12.5" fill="#64748b" font-weight="500" text-anchor="middle">Informar y registrar</text><path d="M190 205 l16 0 m-6 -7 l7 7 l-7 7" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 205 l16 0 m-6 -7 l7 7 l-7 7" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M510 205 l16 0 m-6 -7 l7 7 l-7 7" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M595 292 Q595 340 360 340 Q125 340 125 292" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 6"/><path d="M118 300 l7 -9 l8 9" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/><text x="360" y="368" font-size="12.5" fill="#64748b" font-weight="500" text-anchor="middle">Volvé a empezar cuando cambia la tarea o el lugar</text>
</svg>
