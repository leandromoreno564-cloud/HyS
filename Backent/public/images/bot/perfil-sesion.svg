<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Menú de usuario: perfil y cerrar sesión" font-family="Inter, Segoe UI, Arial, sans-serif">
<rect width="720" height="400" rx="18" fill="#ffffff"/><rect x="1" y="1" width="718" height="398" rx="17" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<rect x="60" y="40" width="600" height="56" rx="14" fill="#0f172a"/><text x="84" y="75" font-size="15" fill="#fff" font-weight="700" text-anchor="start">Panel de Control</text><rect x="470" y="48" width="180" height="40" rx="12" fill="#1e293b"/><rect x="478" y="54" width="28" height="28" rx="8" fill="#f59e0b"/><text x="492" y="74" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">L</text><text x="516" y="73" font-size="13" fill="#fff" font-weight="600" text-anchor="start">Tu nombre</text><rect x="440" y="106" width="230" height="200" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><circle cx="470" cy="138" r="7" fill="#2563eb" opacity=".85"/><text x="488" y="143" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">Ir al panel</text><circle cx="470" cy="182" r="7" fill="#2563eb" opacity=".85"/><text x="488" y="187" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">Mi perfil</text><circle cx="470" cy="226" r="7" fill="#2563eb" opacity=".85"/><text x="488" y="231" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">Ayuda y manual</text><line x1="456" y1="248" x2="654" y2="248" stroke="#e2e8f0"/><circle cx="470" cy="270" r="7" fill="#ef4444" opacity=".85"/><text x="488" y="275" font-size="14" fill="#ef4444" font-weight="700" text-anchor="start">Cerrar sesión</text><path d="M430 80 q-40 20 -70 60" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 5"/><text x="60" y="170" font-size="16" fill="#0f172a" font-weight="800" text-anchor="start">1  Tocá tu nombre</text><text x="60" y="196" font-size="13" fill="#64748b" font-weight="500" text-anchor="start">arriba a la derecha</text><text x="60" y="244" font-size="16" fill="#0f172a" font-weight="800" text-anchor="start">2  Elegí "Mi perfil"</text><text x="60" y="270" font-size="13" fill="#64748b" font-weight="500" text-anchor="start">para cambiar tus datos y tu contraseña</text><text x="60" y="318" font-size="16" fill="#ef4444" font-weight="800" text-anchor="start">3  "Cerrar sesión"</text><text x="60" y="344" font-size="13" fill="#64748b" font-weight="500" text-anchor="start">siempre al terminar, sobre todo en PCs compartidas</text>
</svg>
