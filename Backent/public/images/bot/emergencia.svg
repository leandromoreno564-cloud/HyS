<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Pasos ante una emergencia" font-family="Inter, Segoe UI, Arial, sans-serif">
<rect width="720" height="400" rx="18" fill="#ffffff"/><rect x="1" y="1" width="718" height="398" rx="17" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<text x="360" y="44" font-size="21" fill="#0f172a" font-weight="800" text-anchor="middle">Cómo actuar ante una emergencia</text><text x="360" y="68" font-size="13" fill="#64748b" font-weight="500" text-anchor="middle">En este orden y con calma</text><rect x="40" y="104" width="196" height="106" rx="16" fill="#2563eb" opacity=".10"/><rect x="40" y="104" width="196" height="106" rx="16" fill="none" stroke="#2563eb" stroke-width="2"/><circle cx="76" cy="157" r="22" fill="#2563eb"/><text x="76" y="166" font-size="22" fill="#fff" font-weight="800" text-anchor="middle">1</text><text x="108" y="154" font-size="18" fill="#0f172a" font-weight="800" text-anchor="start">Calma</text><text x="108" y="176" font-size="12" fill="#64748b" font-weight="500" text-anchor="start">Respirá y evaluá</text><path d="M240 157 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/><rect x="262" y="104" width="196" height="106" rx="16" fill="#f59e0b" opacity=".10"/><rect x="262" y="104" width="196" height="106" rx="16" fill="none" stroke="#f59e0b" stroke-width="2"/><circle cx="298" cy="157" r="22" fill="#f59e0b"/><text x="298" y="166" font-size="22" fill="#fff" font-weight="800" text-anchor="middle">2</text><text x="330" y="154" font-size="18" fill="#0f172a" font-weight="800" text-anchor="start">Alarma</text><text x="330" y="176" font-size="12" fill="#64748b" font-weight="500" text-anchor="start">Avisá a todos</text><path d="M462 157 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/><rect x="484" y="104" width="196" height="106" rx="16" fill="#ef4444" opacity=".10"/><rect x="484" y="104" width="196" height="106" rx="16" fill="none" stroke="#ef4444" stroke-width="2"/><circle cx="520" cy="157" r="22" fill="#ef4444"/><text x="520" y="166" font-size="22" fill="#fff" font-weight="800" text-anchor="middle">3</text><text x="552" y="154" font-size="18" fill="#0f172a" font-weight="800" text-anchor="start">911</text><text x="552" y="176" font-size="12" fill="#64748b" font-weight="500" text-anchor="start">Llamá a emergencias</text><rect x="40" y="232" width="196" height="106" rx="16" fill="#10b981" opacity=".10"/><rect x="40" y="232" width="196" height="106" rx="16" fill="none" stroke="#10b981" stroke-width="2"/><circle cx="76" cy="285" r="22" fill="#10b981"/><text x="76" y="294" font-size="22" fill="#fff" font-weight="800" text-anchor="middle">4</text><text x="108" y="282" font-size="18" fill="#0f172a" font-weight="800" text-anchor="start">Evacuá</text><text x="108" y="304" font-size="12" fill="#64748b" font-weight="500" text-anchor="start">Salidas señalizadas</text><path d="M240 285 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/><rect x="262" y="232" width="196" height="106" rx="16" fill="#8b5cf6" opacity=".10"/><rect x="262" y="232" width="196" height="106" rx="16" fill="none" stroke="#8b5cf6" stroke-width="2"/><circle cx="298" cy="285" r="22" fill="#8b5cf6"/><text x="298" y="294" font-size="22" fill="#fff" font-weight="800" text-anchor="middle">5</text><text x="330" y="282" font-size="18" fill="#0f172a" font-weight="800" text-anchor="start">Reunión</text><text x="330" y="304" font-size="12" fill="#64748b" font-weight="500" text-anchor="start">Andá al punto de encuentro</text><path d="M462 285 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/><rect x="484" y="232" width="196" height="106" rx="16" fill="#64748b" opacity=".10"/><rect x="484" y="232" width="196" height="106" rx="16" fill="none" stroke="#64748b" stroke-width="2"/><circle cx="520" cy="285" r="22" fill="#64748b"/><text x="520" y="294" font-size="22" fill="#fff" font-weight="800" text-anchor="middle">6</text><text x="552" y="282" font-size="18" fill="#0f172a" font-weight="800" text-anchor="start">Registrá</text><text x="552" y="304" font-size="12" fill="#64748b" font-weight="500" text-anchor="start">Informá y dejá constancia</text><text x="360" y="372" font-size="12.5" fill="#ef4444" font-weight="600" text-anchor="middle">Si hay fuego o humo: no uses ascensores y no regreses hasta que lo autoricen</text>
</svg>
