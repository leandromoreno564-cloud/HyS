<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="600" height="340" rx="16" fill="#0f172a"/>
  
  <!-- Barra superior de ventana -->
  <rect width="600" height="42" rx="16" fill="#1e293b"/>
  <rect y="26" width="600" height="16" fill="#1e293b"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <text x="80" y="25" fill="#94a3b8" font-size="11" font-weight="600">HyS Control • Modulo de Inspeccion y Checklist</text>
  
  <!-- Contenido principal -->
  <rect x="20" y="58" width="560" height="262" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Titulo del checklist -->
  <text x="38" y="86" fill="#f8fafc" font-size="14" font-weight="700">Checklist Tecnico: Empresa Metalurgica del Sur</text>
  <text x="38" y="103" fill="#64748b" font-size="11">Norma aplicable: Decreto Reglamentario 351/79 • Auditoria Oficial</text>

  <!-- Botonera destacada -->
  <rect x="38" y="118" width="524" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- Boton 1: Extraer PDF -->
  <rect x="48" y="128" width="120" height="34" rx="8" fill="#2563eb"/>
  <text x="64" y="149" fill="#ffffff" font-size="11" font-weight="700">Extraer PDF</text>

  <!-- Boton 2: Camara Evidencias -->
  <rect x="176" y="128" width="115" height="34" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="194" y="149" fill="#93c5fd" font-size="11" font-weight="600">Camara / Foto</text>

  <!-- Boton 3: Firma Digital -->
  <rect x="299" y="128" width="115" height="34" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="318" y="149" fill="#6ee7b7" font-size="11" font-weight="600">Firma Digital</text>

  <!-- Boton 4: Descargar PDF -->
  <rect x="422" y="128" width="130" height="34" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="438" y="149" fill="#fcd34d" font-size="11" font-weight="600">Descargar Informe</text>

  <!-- Item del checklist simulado -->
  <rect x="38" y="184" width="524" height="118" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  
  <text x="52" y="208" fill="#e2e8f0" font-size="12" font-weight="600">1. ¿Las maquinas y herramientas poseen defensas de proteccion en poleas y correas?</text>
  <text x="52" y="225" fill="#64748b" font-size="10">Articulo 103, Decreto 351/79 • Riesgo Mecanico</text>

  <!-- Opciones de cumplimiento -->
  <rect x="52" y="238" width="70" height="26" rx="6" fill="#10b981"/>
  <text x="73" y="255" fill="#ffffff" font-size="10" font-weight="700">CUMPLE</text>

  <rect x="130" y="238" width="90" height="26" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
  <text x="145" y="255" fill="#fca5a5" font-size="10" font-weight="600">NO CUMPLE</text>

  <rect x="228" y="238" width="90" height="26" rx="6" fill="#64748b" fill-opacity="0.2" stroke="#64748b" stroke-width="1"/>
  <text x="249" y="255" fill="#cbd5e1" font-size="10" font-weight="600">NO APLICA</text>

  <!-- Cuadro explicativo lateral -->
  <rect x="340" y="234" width="210" height="54" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="350" y="250" fill="#60a5fa" font-size="10" font-weight="700">Paso 1: Extraer PDF</text>
  <text x="350" y="265" fill="#cbd5e1" font-size="9">Carga automatica del cuestionario</text>
  <text x="350" y="278" fill="#cbd5e1" font-size="9">sin necesidad de tipear las preguntas.</text>
</svg>
