<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="600" height="340" rx="16" fill="#0f172a"/>
  
  <!-- Barra superior -->
  <rect width="600" height="42" rx="16" fill="#1e293b"/>
  <rect y="26" width="600" height="16" fill="#1e293b"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <text x="80" y="25" fill="#94a3b8" font-size="11" font-weight="600">HyS Control • Informe Final y Verificacion QR</text>
  
  <!-- Contenedor -->
  <rect x="20" y="58" width="560" height="262" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Representacion de hoja PDF A4 -->
  <rect x="40" y="74" width="230" height="230" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Membrete en la hoja PDF -->
  <rect x="52" y="86" width="206" height="24" rx="4" fill="#0f172a"/>
  <text x="60" y="102" fill="#ffffff" font-size="8" font-weight="700">IES NUEVO HORIZONTE • INFORME HYS</text>
  
  <!-- Lineas de texto en hoja PDF -->
  <rect x="52" y="118" width="140" height="6" rx="2" fill="#94a3b8"/>
  <rect x="52" y="128" width="100" height="5" rx="2" fill="#cbd5e1"/>
  
  <!-- Mini tabla de no conformidades -->
  <rect x="52" y="140" width="206" height="40" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="56" y="146" width="24" height="24" rx="2" fill="#ef4444" fill-opacity="0.2"/>
  <rect x="84" y="148" width="120" height="5" rx="2" fill="#475569"/>
  <rect x="84" y="157" width="90" height="4" rx="2" fill="#94a3b8"/>

  <!-- Bloque QR dentro de la hoja -->
  <rect x="194" y="224" width="64" height="64" rx="4" fill="#0f172a"/>
  <!-- Simbolo QR -->
  <rect x="200" y="230" width="18" height="18" fill="#ffffff"/>
  <rect x="204" y="234" width="10" height="10" fill="#0f172a"/>
  <rect x="234" y="230" width="18" height="18" fill="#ffffff"/>
  <rect x="238" y="234" width="10" height="10" fill="#0f172a"/>
  <rect x="200" y="264" width="18" height="18" fill="#ffffff"/>
  <rect x="204" y="268" width="10" height="10" fill="#0f172a"/>
  <rect x="224" y="254" width="6" height="6" fill="#ffffff"/>
  <rect x="236" y="266" width="6" height="6" fill="#ffffff"/>
  <rect x="246" y="254" width="6" height="6" fill="#ffffff"/>

  <!-- Panel informativo a la derecha -->
  <rect x="290" y="74" width="270" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="306" y="104" fill="#60a5fa" font-size="13" font-weight="700">Informe PDF con Token QR</text>
  <text x="306" y="126" fill="#cbd5e1" font-size="10">El acta incluye:</text>
  <text x="306" y="144" fill="#94a3b8" font-size="10">• Membrete institucional oficial</text>
  <text x="306" y="160" fill="#94a3b8" font-size="10">• Fotos de evidencias adjuntas</text>
  <text x="306" y="176" fill="#94a3b8" font-size="10">• Rubricas digitales manuscritas</text>
  <text x="306" y="192" fill="#94a3b8" font-size="10">• Token criptografico inalterable</text>

  <!-- Boton de descarga -->
  <rect x="306" y="240" width="238" height="42" rx="8" fill="#2563eb"/>
  <text x="345" y="266" fill="#ffffff" font-size="12" font-weight="700">Descargar Informe PDF Oficial</text>
</svg>
